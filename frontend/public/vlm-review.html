<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLM Review</title>
<style>
:root {
  --bg: #0f1117; --card: #1a1d27; --border: #2a2d37;
  --text: #e4e4e7; --muted: #71717a; --accent: #3b82f6;
  --red: #ef4444; --green: #22c55e; --yellow: #eab308; --orange: #f97316;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .model { color: var(--muted); font-size: 13px; }

.main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; height: calc(100vh - 60px); }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; height: auto; } }

.panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-y: auto; }
.panel h2 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

.drop-zone {
  border: 2px dashed var(--border); border-radius: 8px; padding: 40px 20px;
  text-align: center; cursor: pointer; transition: border-color 0.2s;
}
.drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); }
.drop-zone p { color: var(--muted); font-size: 14px; }
.drop-zone input { display: none; }

.preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 12px; }
.preview-grid img { width: 100%; border-radius: 4px; border: 1px solid var(--border); }

.controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.btn {
  padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: opacity 0.2s;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: white; }
.btn-secondary { background: var(--border); color: var(--text); }

.field-group { margin-bottom: 12px; }
.field-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field-group input, .field-group select {
  width: 100%; padding: 6px 10px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text); font-size: 13px;
}

.result-card { margin-bottom: 12px; }
.result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.result-row .label { color: var(--muted); }
.result-row .value { font-weight: 500; text-align: right; max-width: 60%; word-break: break-word; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;
}
.badge-red { background: rgba(239,68,68,0.2); color: var(--red); }
.badge-green { background: rgba(34,197,94,0.2); color: var(--green); }
.badge-yellow { background: rgba(234,179,8,0.2); color: var(--yellow); }
.badge-orange { background: rgba(249,115,22,0.2); color: var(--orange); }
.badge-blue { background: rgba(59,130,246,0.2); color: var(--accent); }

.stats { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
.stat { background: var(--bg); padding: 8px 12px; border-radius: 6px; }
.stat .val { font-size: 18px; font-weight: 700; }
.stat .lbl { font-size: 11px; color: var(--muted); }

.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 40px; }

.reasoning-box {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px; font-size: 13px; line-height: 1.5; margin-top: 8px; white-space: pre-wrap;
}

.deterrent-box {
  background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); border-radius: 6px;
  padding: 12px; font-size: 13px; line-height: 1.5; margin-top: 8px; white-space: pre-wrap;
}

.history-item {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s;
}
.history-item:hover { border-color: var(--accent); }
.history-item .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.history-item .summary { font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>

<div class="header">
  <h1>VLM Review</h1>
  <span class="model" id="model-label">Model: loading...</span>
</div>

<div class="main">
  <!-- LEFT: Input -->
  <div class="panel">
    <h2>Input</h2>

    <div class="drop-zone" id="drop-zone">
      <p>Drop images here or click to upload</p>
      <p style="font-size:12px;margin-top:4px">(JPEG, PNG — up to 4 frames)</p>
      <input type="file" id="file-input" accept="image/*" multiple>
    </div>

    <div class="preview-grid" id="preview-grid"></div>

    <div style="margin-top:16px">
      <div class="field-group">
        <label>Camera ID</label>
        <input type="text" id="camera-id" value="review-ui" placeholder="CAM-01">
      </div>
      <div class="field-group">
        <label>Zone Name</label>
        <input type="text" id="zone-name" value="" placeholder="restricted-area">
      </div>
      <div class="field-group">
        <label>Class Name</label>
        <select id="class-name">
          <option value="unknown">unknown</option>
          <option value="person">person</option>
          <option value="bag">bag</option>
          <option value="vehicle">vehicle</option>
        </select>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="analyze-btn" disabled>Analyze</button>
      <button class="btn btn-secondary" id="clear-btn">Clear</button>
      <span id="status" style="font-size:13px;color:var(--muted)"></span>
    </div>

    <!-- History -->
    <div style="margin-top:24px">
      <h2>History</h2>
      <div id="history-list"><p class="empty">No analyses yet</p></div>
    </div>
  </div>

  <!-- RIGHT: Output -->
  <div class="panel">
    <h2>Output</h2>
    <div id="output-area"><p class="empty">Upload an image and click Analyze</p></div>
  </div>
</div>

<script>
const API = (() => {
  const h = location.hostname || 'localhost';
  const p = location.protocol || 'http:';
  return `${p}//${h}:8082/api`;
})();

let frames = []; // {file, base64, dataUrl}
let history = [];

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const previewGrid = document.getElementById('preview-grid');
const analyzeBtn = document.getElementById('analyze-btn');
const clearBtn = document.getElementById('clear-btn');
const statusEl = document.getElementById('status');
const outputArea = document.getElementById('output-area');
const historyList = document.getElementById('history-list');
const modelLabel = document.getElementById('model-label');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
clearBtn.addEventListener('click', clearAll);
analyzeBtn.addEventListener('click', runAnalysis);

function addFiles(fileList) {
  for (const f of fileList) {
    if (frames.length >= 4) break;
    if (!f.type.startsWith('image/')) continue;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(',')[1];
      frames.push({ file: f, base64, dataUrl });
      renderPreviews();
    };
    reader.readAsDataURL(f);
  }
}

function renderPreviews() {
  previewGrid.innerHTML = frames.map((f, i) =>
    `<img src="${f.dataUrl}" alt="Frame ${i+1}" title="${f.file.name}">`
  ).join('');
  analyzeBtn.disabled = frames.length === 0;
}

function clearAll() {
  frames = [];
  previewGrid.innerHTML = '';
  analyzeBtn.disabled = true;
  statusEl.textContent = '';
  outputArea.innerHTML = '<p class="empty">Upload an image and click Analyze</p>';
}

async function runAnalysis() {
  analyzeBtn.disabled = true;
  statusEl.innerHTML = '<span class="spinner"></span> Analyzing...';
  outputArea.innerHTML = '<p class="empty"><span class="spinner"></span> Running VLM inference...</p>';

  const body = {
    frames_base64: frames.map(f => f.base64),
    camera_id: document.getElementById('camera-id').value || 'review-ui',
    zone_name: document.getElementById('zone-name').value || '',
    class_name: document.getElementById('class-name').value || 'unknown',
  };

  try {
    const resp = await fetch(`${API}/vlm/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body),
    });
    const data = await resp.json();

    if (data.status !== 'ok') {
      statusEl.textContent = `Error: ${data.status}`;
      outputArea.innerHTML = `<p class="empty">Error: ${data.message || data.status}</p>`;
      analyzeBtn.disabled = false;
      return;
    }

    modelLabel.textContent = `Model: ${data.model}`;
    renderResult(data);
    addToHistory(data, frames[0]?.dataUrl);
    statusEl.textContent = `Done in ${(data.inference_time_ms / 1000).toFixed(1)}s`;
  } catch (e) {
    statusEl.textContent = `Failed: ${e.message}`;
    outputArea.innerHTML = `<p class="empty">Request failed: ${e.message}</p>`;
  }
  analyzeBtn.disabled = false;
}

function renderResult(data) {
  const r = data.response;
  const hasStructured = r.confidence > 0;

  outputArea.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="val">${(data.inference_time_ms / 1000).toFixed(1)}s</div><div class="lbl">Inference</div></div>
      <div class="stat"><div class="val">${data.frames_analyzed}</div><div class="lbl">Frames</div></div>
      <div class="stat"><div class="val">${data.model.split('/').pop()}</div><div class="lbl">Model</div></div>
    </div>

    <h2>Scene Description</h2>
    <div class="reasoning-box">${r.person_description || r.reasoning || 'No description returned'}</div>

    ${r.reasoning && r.reasoning !== r.person_description ? `
      <h2 style="margin-top:16px">Reasoning</h2>
      <div class="reasoning-box">${r.reasoning}</div>
    ` : ''}

    ${r.deterrent_message ? `
      <h2 style="margin-top:16px">Deterrent Message</h2>
      <div class="deterrent-box">${r.deterrent_message}</div>
    ` : ''}

    <details style="margin-top:16px;${hasStructured ? '' : 'opacity:0.5'}">
      <summary style="font-size:12px;color:var(--muted);cursor:pointer">
        Structured fields ${hasStructured ? '' : '(defaults — model returned prose only)'}
      </summary>
      <div class="result-card" style="margin-top:8px">
        <div class="result-row"><span class="label">Verdict</span><span class="value">${r.is_dumping ? '<span class="badge badge-red">DUMPING</span>' : '<span class="badge badge-green">CLEAR</span>'}</span></div>
        <div class="result-row"><span class="label">Confidence</span><span class="value">${(r.confidence * 100).toFixed(0)}%</span></div>
        <div class="result-row"><span class="label">Severity</span><span class="value">${r.severity}</span></div>
        <div class="result-row"><span class="label">Waste Type</span><span class="value">${r.waste_type || 'none'}</span></div>
        <div class="result-row"><span class="label">Action</span><span class="value">${r.action || '—'}</span></div>
        <div class="result-row"><span class="label">Command</span><span class="value">${r.command || '—'}</span></div>
      </div>
    </details>
  `;
}

function addToHistory(data, thumbUrl) {
  const r = data.response;
  history.unshift({
    time: new Date().toLocaleTimeString(),
    model: data.model,
    ms: data.inference_time_ms,
    description: (r.person_description || r.reasoning || '').substring(0, 100),
    thumbUrl,
    fullData: data,
  });
  if (history.length > 20) history.pop();
  renderHistory();
}

function renderHistory() {
  historyList.innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="showHistoryItem(${i})">
      <div class="meta">
        <span>${h.time}</span>
        <span>${(h.ms / 1000).toFixed(1)}s</span>
      </div>
      <div class="summary">${h.description}</div>
    </div>
  `).join('');
}

window.showHistoryItem = function(i) {
  renderResult(history[i].fullData);
};
</script>
</body>
</html>
