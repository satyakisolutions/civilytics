# Civilytics dashboard — static SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a single-page application behind react-router. Any path
    # that is not a real file must return index.html, or a deep link such
    # as /history reloads into a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset filenames, so they are safe to cache
    # permanently. index.html must NOT be cached, or a deploy leaves
    # browsers on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API is a separate origin here; tighten or extend these at the
    # reverse proxy that terminates TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
