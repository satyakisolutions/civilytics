# Civilytics TURN relay (coturn).
#
# WHY THIS EXISTS
# mediamtx serves WebRTC media as ICE over UDP. A browser on the same LAN
# connects directly to mediamtx:8189. A browser behind symmetric NAT or a
# restrictive corporate firewall cannot, and the public STUN fallback in
# mediamtx.yml does not help with symmetric NAT -- only a RELAY does.
#
# WHAT IT COSTS
# This does NOT reduce the number of published ports; it increases it.
# Direct ICE needs one UDP port (8189). TURN needs 3478, 5349 and a relay
# range. Enable it only when clients are off the camera LAN.
#
# Started via the `turn` compose profile:
#   docker compose -f docker-compose.prod.yml --profile turn up -d

listening-port=3478
# TLS on 5349, the IANA port. NOT 443 -- nginx owns that in this stack.
tls-listening-port=5349
# This pair is mounted from TLS_CERT_DIR by compose. TURN-over-TLS clients
# validate this certificate independently of nginx, so it must cover the
# public TURN hostname (normally TURN_HOST), not merely the dashboard host.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

fingerprint
lt-cred-mech
realm=civilytics

# Static credential. Rotate it like any other secret; a TURN server with
# known credentials is an open relay others can use for bandwidth.
# Substituted from TURN_USER / TURN_PASSWORD by the entrypoint.
user=${TURN_USER}:${TURN_PASSWORD}

# The address clients should be told to reach this relay on. Must be the
# PUBLIC address, not the container IP, or ICE candidates are unusable.
external-ip=${TURN_EXTERNAL_IP}

# Narrow relay range: 340 ports rather than coturn's default 49152-65535
# (16k). Keeps the firewall rule reviewable. Raise if concurrent viewers
# exceed roughly this count (each session consumes a pair).
min-port=49160
max-port=49500

total-quota=100
bps-capacity=40000000
max-bps=40000000
stale-nonce

# Lock down what the relay will forward. Without these a TURN server can
# be used to reach private networks and loopback services.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# Allow the compose network so coturn can reach mediamtx.
allowed-peer-ip=172.16.0.0-172.31.255.255

no-cli
simple-log
