logLevel: info
logDestinations: [stdout]
api: yes
apiAddress: :9997
rtsp: yes
rtspAddress: :8554
webrtc: yes
webrtcAddress: :8889
pathDefaults:
  source: publisher
  sourceOnDemand: no
  record: no
paths:
  all_others:

  # --- Per-camera annotated output streams (from DeepStream pipeline) ---
  # The DeepStream pipeline now pushes each camera's annotated output to
  # mediamtx via RTSP ANNOUNCE (rtspclientsink) instead of raw UDP/RTP.
  # Paths are created on first publish against the `all_others` default
  # (source: publisher), so no per-camera stanza is required here.
  # The frontend reads them via WebRTC at
  #   http://mediamtx:8889/{path}/whep
  # Leaving the old `cam-XX-out: source: udp://...` stanzas in place
  # would make mediamtx reserve those paths as UDP-MPEG-TS pullers and
  # then reject the RTSP ANNOUNCE with 400 Bad Request.
