[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wastewatch-backend"
version = "0.1.0"
description = "WasteWatch backend — real-time illegal waste dumping detection API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "aiokafka>=0.12.0",
    "pydantic-settings>=2.7.0",
    "orjson>=3.10.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic[email]>=2.7.0",
    "aiofiles>=24.1.0",
    "aiosmtplib>=3.0.0",
    "psutil>=6.0.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "piper-tts>=1.4.0",
    "Pillow>=10.0.0",
    "onnxruntime>=1.20.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
