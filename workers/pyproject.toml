[project]
name = "civilytics-workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "aiokafka>=0.11",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "structlog>=24.0",
    # ReID (workers/workers/tasks/run_reid.py)
    "qdrant-client>=1.12.0",
    "torch>=2.0",
    "Pillow>=10.0.0",
    "clip @ git+https://github.com/openai/CLIP.git",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
