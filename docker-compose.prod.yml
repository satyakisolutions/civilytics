# ──────────────────────────────────────────────────────────────────────
# Civilytics / WasteWatch — PRODUCTION
#
#   docker compose -f docker-compose.prod.yml up -d
#
# 11 containers. Differences from dev/test that matter:
#
#   1. NO SOURCE BIND MOUNTS. Everything runs from the built image, so a
#      deploy is an image change, not a host-file change.
#   2. SECRETS ARE REQUIRED. Passwords use ${VAR:?...}, so the stack
#      refuses to start rather than coming up with a known default.
#   3. ONLY THE BROWSER-FACING PORTS ARE PUBLISHED. Postgres, Kafka,
#      Redis and Keycloak's admin port stay on the internal network.
#   4. restart: always (not unless-stopped), so a host reboot brings the
#      stack back without manual intervention.
#   5. Log rotation on every service — an unbounded json-file driver has
#      filled the disk on more than one DeepStream box.
#
# BEFORE FIRST DEPLOY:
#   - WW_AUTH_DEV_MODE must be absent or 0. It bypasses REST *and*
#     WebSocket auth and grants owner+admin+viewer.
#   - Keycloak realm must define composite roles owner -> admin -> viewer
#     (realm roles are flat; require_role() matches the exact string).
#   - WW_AUTH_COOKIE_SECURE stays true, which means the dashboard MUST be
#     served over HTTPS or the browser will drop the session cookie.
# ──────────────────────────────────────────────────────────────────────

# Separate project, so a dev stack on the same host can never be
# stopped or rebuilt by a prod command.
name: civilytics-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-ww-env: &ww-env
  WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  WW_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  WW_MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
  WW_MEDIAMTX_API_URL: http://mediamtx:9997

services:
  # ── Data stores (not published to the host) ────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wastewatch
      POSTGRES_USER: ${POSTGRES_USER:-wastewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wastewatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging
    restart: always

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Bound the log so a stalled consumer cannot fill the disk.
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-72}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-5368709120}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-wastewatch-kafka-cluster-01}
    expose:
      - "9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging
    restart: always

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy volatile-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging
    restart: always

  # ── Identity ───────────────────────────────────────────────────────
  # NOTE -- onboarding email. Keycloak sends the "set your password" link
  # itself, using its REALM smtp config, which lives in the database and is
  # NOT read from any environment variable here. WW_SMTP_* below configures
  # only our own reports worker. After first start, set
  #   Realm settings -> Email
  # to the same relay as WW_SMTP_HOST, or every onboarded user is created
  # successfully and can never sign in. Use a real relay with SPF/DKIM on
  # the sending domain; mail from an unauthenticated host on a municipal
  # network is filed as spam, which looks identical to "email broken".
  # There is deliberately no mailpit here -- capture-only mail in
  # production would silently swallow every onboarding link.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    # `start`, not `start-dev`: production mode, no dev defaults.
    command: ["start", "--optimized"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/wastewatch
      KC_DB_USERNAME: ${POSTGRES_USER:-wastewatch}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KC_HOSTNAME:?Set KC_HOSTNAME (e.g. auth.civilytics.in)}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"      # TLS terminates at the reverse proxy
      KC_HEALTH_ENABLED: "true"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # KC_HEALTH_ENABLED exposes /health/ready on the management port
      # (9000 in KC 24). The image has no curl, so use bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *logging
    restart: always

  # ── Media ──────────────────────────────────────────────────────────
  # Stays a separate container deliberately: pipeline restarts are
  # frequent (NVENC faults, EOS, config reloads) and must not drop every
  # browser's WebRTC session. See docs/CONTAINER_PLAN.md.
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      # The ONLY non-nginx published port in this stack, and it cannot be
      # avoided: WebRTC media is ICE over UDP and nginx cannot proxy it.
      # Close it by running coturn and pointing webrtcICEServers2 at it.
      - "8189:8189/udp"
    expose:
      - "8554"             # RTSP — reached via the nginx stream proxy on :554
      - "8889"             # WebRTC signalling — reached via nginx /webrtc/
      - "9997"             # control API — internal only
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9997/v3/paths/list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging: *logging
    restart: always

  # ── Application ────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
    expose:
      - "8080"             # internal only — reached via nginx /api/ and /ws/
    env_file:
      - .env
    environment:
      <<: *ww-env
      WW_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wastewatch}:${POSTGRES_PASSWORD}@postgres:5432/wastewatch
      WW_KEYCLOAK_URL: http://keycloak:8080
      WW_KEYCLOAK_REALM: ${WW_KEYCLOAK_REALM:-wastewatch}
      WW_KEYCLOAK_CLIENT_ID: ${WW_KEYCLOAK_CLIENT_ID:-wastewatch-api}
      WW_KEYCLOAK_CLIENT_SECRET: ${WW_KEYCLOAK_CLIENT_SECRET:?Set WW_KEYCLOAK_CLIENT_SECRET in .env}
      WW_EVIDENCE_DIR: /app/evidence
      WW_TTS_DIR: /tmp/wastewatch/tts
      # Requires HTTPS at the proxy. Without TLS the browser drops the
      # session cookie and every request arrives anonymous.
      WW_AUTH_COOKIE_SECURE: "true"
      WW_AUTH_COOKIE_SAMESITE: ${WW_AUTH_COOKIE_SAMESITE:-lax}
      WW_AUTH_COOKIE_DOMAIN: ${WW_AUTH_COOKIE_DOMAIN:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - tts_data:/tmp/wastewatch/tts
      - evidence_data:/app/evidence
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "2"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
    restart: always

  backend-workers:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      <<: *ww-env
      WW_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wastewatch}:${POSTGRES_PASSWORD}@postgres:5432/wastewatch
      WW_SMTP_HOST: ${WW_SMTP_HOST:-}
      WW_SMTP_PORT: ${WW_SMTP_PORT:-587}
      WW_SMTP_USER: ${WW_SMTP_USER:-}
      WW_SMTP_PASSWORD: ${WW_SMTP_PASSWORD:-}
      WW_SMTP_FROM: ${WW_SMTP_FROM:-wastewatch@satyaki.co.in}
      WW_SMTP_TLS: ${WW_SMTP_TLS:-true}
      # Optional outbound channels — opt in per deployment.
      WW_SMTP_ENABLED: ${WW_SMTP_ENABLED:-false}
      WW_TELEGRAM_ENABLED: ${WW_TELEGRAM_ENABLED:-false}
      WW_SIP_ENABLED: ${WW_SIP_ENABLED:-false}
      WW_IP_SPEAKER_ENABLED: ${WW_IP_SPEAKER_ENABLED:-false}
      WW_TTS_ENABLED: ${WW_TTS_ENABLED:-false}
      WW_INCIDENT_ENABLED: ${WW_INCIDENT_ENABLED:-false}
      # Backup / archive target (MinIO below, or any S3-compatible endpoint).
      WW_S3_ENDPOINT: ${WW_S3_ENDPOINT:-http://minio:9000}
      WW_S3_BUCKET: ${WW_S3_BUCKET:-wastewatch-evidence}
      WW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      WW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      WW_BACKUP_ENABLED: ${WW_BACKUP_ENABLED:-false}
    depends_on:
      # api and pipeline come up FIRST: they are the two services that must
      # be available, and the workers only consume what the pipeline emits.
      api:
        condition: service_healthy
      pipeline:
        condition: service_healthy
    healthcheck:
      # The healer's MCP server is the only socket this container opens.
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1',9100))==0 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    volumes:
      - evidence_data:/tmp/wastewatch/evidence
      # The healer inspects and restarts sibling containers. This grants
      # effective root on the host — drop this mount and set
      # WW_HEALER_ENABLED=false if self-healing is not wanted in prod.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "9100"
    command: ["python3", "-m", "services.combined_workers.main"]
    logging: *logging
    restart: always

  pipeline:
    build:
      context: ./pipeline
    env_file:
      - .env
    environment:
      <<: *ww-env
      WW_EVIDENCE_DIR: /app/evidence
      WW_USE_SEG_MODEL: ${WW_USE_SEG_MODEL:-1}
      WW_SOURCES: ""
      GST_DEBUG: ${GST_DEBUG:-1}
    volumes:
      # Models live in a named volume, not a bind mount. entrypoint.py
      # Phase 1 builds any missing engine and rebuilds a corrupt one
      # before the pipeline starts.
      - pipeline_models:/app/models
      - evidence_data:/app/evidence
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      # app/heartbeat.py exits 0 only if health_check_cb wrote within 45s
      # (it runs every 10s, so three missed ticks are tolerated). A file
      # check, not Redis -- a Redis outage must not mark a pipeline that
      # is happily processing frames as unhealthy.
      test: ["CMD", "python3", "-m", "app.heartbeat"]
      interval: 20s
      timeout: 10s
      retries: 3
      # Generous: a cold start may build a TensorRT engine first.
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging: *logging
    restart: always

  frontend:
    build:
      context: ./frontend
      # Vite inlines VITE_* at BUILD time. These are build args, not
      # runtime env -- changing them requires a rebuild, not a restart.
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL (e.g. https://civilytics.example/api)}
        VITE_WS_URL: ${PUBLIC_WS_URL:?Set PUBLIC_WS_URL (e.g. wss://civilytics.example/ws)}
        VITE_MEDIAMTX_URL: ${PUBLIC_MEDIAMTX_URL:?Set PUBLIC_MEDIAMTX_URL}
    expose:
      - "80"               # internal only — reached via nginx /
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: always

  # ── Deterrent audio (feature-flagged) ──────────────────────────────
  # Only needed while the EN/KN warnings are synthesised at runtime. If
  # the phrase set is fixed, pre-render to files at build time and drop
  # this service entirely.
  tts:
    image: python:3.11-slim
    command: >
      bash -c "pip install --no-cache-dir piper-tts && python -m http.server 8100"
    expose:
      - "8100"
    volumes:
      - tts_data:/tmp/wastewatch/tts
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # pip install piper-tts on first boot
    logging: *logging
    restart: always

  # ── Object storage: evidence archive + DB backups ──────────────────
  # On-prem S3. If the client supplies an external S3 endpoint
  # (AWS/Wasabi/Backblaze), delete this service and point WW_S3_ENDPOINT
  # at theirs instead.
  #
  # For contested evidence, enable versioning and object lock on the
  # evidence bucket so a clip cannot be silently altered or deleted, and
  # keep DB backups in a SEPARATE bucket that can still be rotated.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    expose:
      - "9000"             # S3 API — internal only
      - "9001"             # console — reached via nginx /storage/
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging
    restart: always

  # ── Ingress: the ONLY container with published ports ───────────────
  # 443 carries the dashboard, REST API, WebSockets, WebRTC signalling and
  # the MinIO console. 554 proxies RTSP ingest to mediamtx (L4 stream
  # module), so mediamtx's own 8554 stays off the host.
  #
  # Starts LAST, after api and pipeline are healthy, so the first request
  # it accepts cannot hit a half-started backend.
  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"            # redirects to 443 only
      - "443:443"
      - "554:554"          # RTSP ingest from cameras
    environment:
      NGINX_SERVER_NAME: ${KC_HOSTNAME:?Set KC_HOSTNAME in .env}
    volumes:
      # Mount a real certificate here. Without it the entrypoint generates
      # a self-signed one and logs a warning -- the app still works but
      # browsers warn, and WW_AUTH_COOKIE_SECURE requires HTTPS.
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      pipeline:
        condition: service_healthy
      frontend:
        condition: service_started
      mediamtx:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *logging
    restart: always

  # ── TURN relay (OPT-IN: `--profile turn`) ──────────────────────────
  # Only needed when browsers view streams from OUTSIDE the camera LAN.
  # A browser on the LAN reaches mediamtx's UDP 8189 directly; one behind
  # symmetric NAT or a restrictive firewall cannot, and STUN does not help
  # with symmetric NAT -- only a relay does.
  #
  # NOTE this INCREASES published ports (3478, 5349, plus a 340-port relay
  # range) rather than reducing them. Enable deliberately.
  #
  # With this running, point mediamtx.yml's webrtcICEServers2 at it:
  #   webrtcICEServers2:
  #     - url: turn:<TURN_EXTERNAL_IP>:3478
  #       username: <TURN_USER>
  #       password: <TURN_PASSWORD>
  # and mediamtx's own 8189 can then be unpublished.
  coturn:
    image: coturn/coturn:4.6-alpine
    profiles: ["turn"]
    environment:
      # Deliberately NOT the ${VAR:?} fail-fast form: compose interpolates
      # these even when the `turn` profile is OFF, which would make the
      # whole prod stack refuse to validate without TURN credentials it
      # does not need. coturn/entrypoint.sh enforces them instead, so a
      # missing value fails loudly only if coturn is actually started.
      TURN_USER: ${TURN_USER:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      # MUST be the public address clients reach, not a container IP, or
      # the ICE candidates coturn advertises are unusable.
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"            # TURN over TLS
      - "49160-49500:49160-49500/udp"   # relay range, matches turnserver.conf
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf.template:ro
      - ./coturn/entrypoint.sh:/entrypoint.sh:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/coturn/certs:ro
    entrypoint: ["/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pidof turnserver >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *logging
    restart: always

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  tts_data:
  evidence_data:
  pipeline_models:
  minio_data:
  nginx_logs:
