# ─────────────────────────────────────────────────────────────────────
# Civilytics — production ingress.
#
# This is the ONLY container with published ports. Everything else talks
# over the internal compose network and is unreachable from outside.
#
#   443/tcp  → everything the browser needs (dashboard, API, WebSocket,
#              WebRTC signalling, MinIO console)
#   554/tcp  → RTSP ingest from cameras, proxied to mediamtx:8554
#
# WHAT CANNOT GO THROUGH HERE
# mediamtx's WebRTC media is ICE over UDP (mediamtx.yml:
# `webrtcLocalUDPAddress: :8189`). nginx cannot proxy UDP media, so that
# one port stays published on the mediamtx container. The reference
# deployment (Bluepolicy/lvep24) hits the same wall and publishes 8889 +
# 8189/udp directly for the same reason.
#
# To close even that, run a TURN server (coturn) and point
# `webrtcICEServers2` at it, so media is relayed over a single known
# port instead of an ephemeral UDP range. Not wired here.
# ─────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 2048;
    accept_mutex on;
}

# ── RTSP ingest (L4) ─────────────────────────────────────────────────
# Cameras publish to this host on 554; nginx forwards to mediamtx. Keeps
# mediamtx's own 8554 off the host entirely.
stream {
    upstream rtsp_backend {
        server mediamtx:8554;
    }

    server {
        listen 0.0.0.0:554;
        proxy_pass rtsp_backend;
        proxy_timeout 60s;           # RTSP sessions are long-lived
        proxy_connect_timeout 10s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;              # don't advertise the nginx version

    log_format civilytics '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log civilytics;

    upstream api_backend       { server api:8080; }
    upstream frontend_backend  { server frontend:80; }
    upstream webrtc_backend    { server mediamtx:8889; }
    upstream minio_console     { server minio:9001; }

    # Plain HTTP exists only to redirect. Session cookies are set with
    # Secure, so the app cannot work over HTTP at all.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name ${NGINX_SERVER_NAME};

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 256M;      # evidence uploads
        proxy_connect_timeout 60;
        proxy_send_timeout    600;
        proxy_read_timeout    600;
        send_timeout          600;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Dashboard (static SPA) ───────────────────────────────────
        location / {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── REST API ─────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Cookies are set by POST /api/auth/login and must reach the
            # browser unmodified, so no proxy_cookie_* rewriting here.
        }

        # ── WebSockets: /ws/alerts, /ws/events, /ws/metadata/{id} ────
        # The Upgrade headers are mandatory; without them the handshake
        # returns 200 and the socket never opens.
        location /ws/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Auth travels in the Sec-WebSocket-Protocol subprotocol
            # (see backend/app/auth/ws_auth.py); nginx forwards it as part
            # of the handshake, so nothing extra is needed for it.
            proxy_read_timeout 3600;    # these sockets are idle for long stretches
            proxy_send_timeout 3600;
        }

        # ── WebRTC signalling (WHEP) ─────────────────────────────────
        # Signalling is HTTP so it proxies fine. The MEDIA still arrives
        # on mediamtx's UDP 8189 directly -- see the header comment.
        location /webrtc/ {
            proxy_pass http://webrtc_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── MinIO console ────────────────────────────────────────────
        # Operator-facing object browser. Remove this block if the
        # console should not be reachable at all.
        location /storage/ {
            proxy_pass http://minio_console/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Liveness for the load balancer. Deliberately NOT proxied to
        # /api/health -- this answers "is the ingress up", and must not
        # depend on the API being up.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
