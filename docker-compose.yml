services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wastewatch
      POSTGRES_USER: wastewatch
      POSTGRES_PASSWORD: wastewatch_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastewatch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: wastewatch-kafka-cluster-01
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_in_production}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"       # RTSP
      - "8889:8889"       # WebRTC HTTP (WHEP)
      - "8189:8189/udp"   # WebRTC media (ICE/UDP) — matches webrtcLocalUDPAddress
      - "9997:9997"       # API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/wastewatch
      KC_DB_USERNAME: wastewatch
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "8180:8080"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── API server (REST + WebSocket only, no workers) ──────────────
  # NOTE: host port 8080 collides with another running container on this
  # workstation (plant-pulse); using 8082 locally. Change via
  # docker-compose.override.yml if you want a different host port.
  api:
    build:
      context: ./backend
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      WW_MEDIAMTX_API_URL: http://mediamtx:9997
      WW_MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      WW_KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - tts_data:/tmp/wastewatch/tts
      - evidence_data:/app/evidence
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped

  # ── VLM Analysis Service (GPU-bound) ──────────────────────────
  vlm-worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_VLM_BASE_URL: http://vlm:8000/v1
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python3", "-m", "services.vlm.main"]
    restart: unless-stopped

  # ── TTS Service (CPU-bound) ───────────────────────────────────
  tts-worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - tts_data:/tmp/wastewatch/tts
      - ./backend/models/piper:/tmp/piper_voices:ro
      - pipeline_models:/models:ro
    command: ["python3", "-m", "services.tts.main"]
    restart: unless-stopped

  # ── LPR Service (PaddleOCR) ───────────────────────────────────
  lpr-worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python3", "-m", "services.lpr.main"]
    restart: unless-stopped

  # ── Alert Service (Telegram + IP Speaker) ─────────────────────
  alert-svc:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python3", "-m", "services.alerts.main"]
    restart: unless-stopped

  # ── SIP / Escalation Service ──────────────────────────────────
  sip-svc:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python3", "-m", "services.sip.main"]
    restart: unless-stopped

  # ── Evidence Service (Recording + Dropbox) ────────────────────
  evidence-svc:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - evidence_data:/tmp/wastewatch/evidence
    command: ["python3", "-m", "services.evidence.main"]
    restart: unless-stopped

  # ── Health Monitor Service ─────────────────────────────────────
  health-monitor:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      WW_MEDIAMTX_API_URL: http://mediamtx:9997
      WW_VLM_BASE_URL: http://vlm:8000/v1
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python3", "-m", "services.health_monitor.main"]
    restart: unless-stopped

  # ── Log Ingestion Service ─────────────────────────────────────
  log-worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python3", "-m", "services.logs.main"]
    restart: unless-stopped

  # ── Report Generation Service (SMTP email reports) ────────────
  reports:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      WW_DATABASE_URL: ${WW_DATABASE_URL}
      WW_SMTP_HOST: ${WW_SMTP_HOST:-}
      WW_SMTP_PORT: ${WW_SMTP_PORT:-587}
      WW_SMTP_USER: ${WW_SMTP_USER:-}
      WW_SMTP_PASSWORD: ${WW_SMTP_PASSWORD:-}
      WW_SMTP_FROM: ${WW_SMTP_FROM:-wastewatch@satyaki.co.in}
      WW_SMTP_TLS: ${WW_SMTP_TLS:-true}
      WW_SMTP_ENABLED: ${WW_SMTP_ENABLED:-false}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python3", "-m", "services.reports.main"]
    restart: unless-stopped

  # ── Self-Healing Agent + MCP Server ──────────────────────────
  healer:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - evidence_data:/tmp/wastewatch/evidence
    ports:
      - "9100:9100"
    command: ["python3", "-m", "services.healer.main"]
    restart: unless-stopped

  pipeline:
    build:
      context: ./pipeline
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      WW_MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
    depends_on:
      kafka:
        condition: service_healthy
      mediamtx:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vlm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      --quantization awq
      --dtype float16
      --max-model-len 16384
      --gpu-memory-utilization 0.85
      --limit-mm-per-prompt '{"image": 8}'
      --port 8000
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  tts:
    image: python:3.11-slim
    command: >
      bash -c "pip install piper-tts && python -m http.server 8100"
    ports:
      - "8100:8100"
    volumes:
      - tts_data:/tmp/wastewatch/tts
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  tts_data:
  qdrant_data:
  evidence_data:
  pipeline_models:
