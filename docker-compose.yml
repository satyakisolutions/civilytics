services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: wastewatch-kafka-cluster-01
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC
      - "9997:9997"   # API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_REDIS_URL: redis://redis:6379/0
      WW_MEDIAMTX_API_URL: http://mediamtx:9997
      WW_MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      WW_VLM_BASE_URL: http://vlm:8000/v1
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  pipeline:
    build:
      context: ./pipeline
    env_file:
      - .env
    environment:
      WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WW_REDIS_URL: redis://redis:6379/0
      WW_MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
    depends_on:
      kafka:
        condition: service_healthy
      mediamtx:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vlm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      --quantization awq
      --max-model-len 4096
      --gpu-memory-utilization 0.6
      --port 8000
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  tts:
    image: python:3.11-slim
    command: >
      bash -c "pip install piper-tts && python -m http.server 8100"
    ports:
      - "8100:8100"
    volumes:
      - tts_data:/data/tts
    restart: unless-stopped

volumes:
  kafka_data:
  redis_data:
  tts_data:
