# ──────────────────────────────────────────────────────────────────────
# Civilytics / WasteWatch — TEST (integration / pre-release)
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v
#
# 9 containers. Same topology as prod so integration failures surface
# here, but with three deliberate differences:
#
#   1. STATE IS EPHEMERAL. postgres/kafka/redis use tmpfs, so `down`
#      leaves nothing behind and every run starts from a known-empty DB.
#   2. NO RESTART POLICIES. A crashing service must stay down and fail
#      the run instead of silently looping.
#   3. HOST PORTS OFFSET BY +1000 so a test stack can run alongside dev
#      on the same workstation without port collisions.
#
# Requires a GPU for the pipeline, same as dev and prod.
# ──────────────────────────────────────────────────────────────────────

# Separate project so a test stack can run alongside dev. Host
# ports are also offset +1000 for the same reason.
name: civilytics-test

x-ww-env: &ww-env
  WW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  WW_REDIS_URL: redis://:${REDIS_PASSWORD:-test_redis}@redis:6379/0
  WW_MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
  WW_MEDIAMTX_API_URL: http://mediamtx:9997

services:
  # ── Data stores (ephemeral) ────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wastewatch
      POSTGRES_USER: wastewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_postgres}
      # tmpfs means fsync durability is pointless; skip it for speed.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "6433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastewatch"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: wastewatch-kafka-test-01
    ports:
      - "10092:9092"
    tmpfs:
      - /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    # --save '' disables RDB snapshots; nothing here needs to survive.
    command: redis-server --requirepass ${REDIS_PASSWORD:-test_redis} --save ''
    ports:
      - "7380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-test_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Identity ───────────────────────────────────────────────────────
  # Realm is imported from file so a test run has known users and roles.
  # The realm export must define composite roles owner -> admin -> viewer,
  # because Keycloak realm roles are flat and require_role() matches the
  # exact role string (see backend/app/auth/keycloak.py).
  # ── SMTP relay (capture-only) ─────────────────────────────────
  # Keycloak sends the onboarding "set your password" email itself, from its
  # REALM smtp config -- WW_SMTP_* only reaches our own reports worker, so
  # without a relay here the onboarding link is never delivered and a new
  # user can never sign in.
  #
  # Mailpit accepts everything on 1025 and delivers NOTHING outbound; mail
  # lands in a web inbox instead. That is what you want off production: the
  # onboarding link is clickable during development without any risk of
  # mailing a real municipal address. Both Keycloak's realm and our reports
  # worker point at this one relay.
  mailpit:
    image: axllent/mailpit:latest
    container_name: civilytics-test-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "9025:8025"      # web inbox -- open this to click the setup link
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/wastewatch
      KC_DB_USERNAME: wastewatch
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-test_postgres}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "9180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    volumes:
      # Create this export to seed test users/roles. Absent, Keycloak
      # starts with an empty realm and auth tests will fail loudly --
      # which is the correct outcome, not a silent pass.
      - ./keycloak/realm-test.json:/opt/keycloak/data/import/realm-test.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── Media ──────────────────────────────────────────────────────────
      mailpit:
        condition: service_healthy
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "9554:8554"
      - "9889:8889"
      - "9189:8189/udp"
      - "10997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9997/v3/paths/list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Application ────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
    ports:
      - "9082:8080"
    env_file:
      - .env
    environment:
      <<: *ww-env
      WW_KEYCLOAK_URL: http://keycloak:8080
      WW_KEYCLOAK_REALM: wastewatch
      WW_KEYCLOAK_CLIENT_ID: wastewatch-api
      # Must match clients[0].secret in keycloak/realm-test.json. Test-only.
      WW_KEYCLOAK_CLIENT_SECRET: test-client-secret-not-for-production
      # Must be explicit: without it settings.py falls back to .env, which
      # points at the DEV database -- a test run would then mutate dev data.
      WW_DATABASE_URL: postgresql+asyncpg://wastewatch:${POSTGRES_PASSWORD:-test_postgres}@postgres:5432/wastewatch
      WW_EVIDENCE_DIR: /app/evidence
      WW_TTS_DIR: /tmp/wastewatch/tts
      WW_AUTH_COOKIE_SECURE: "false"
      # Auth stays ON in test. Enabling dev mode here would make every
      # auth and RBAC test pass vacuously.
      WW_AUTH_DEV_MODE: "0"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - evidence_test:/app/evidence
      - tts_test:/tmp/wastewatch/tts
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend-workers:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      <<: *ww-env
      WW_DATABASE_URL: postgresql+asyncpg://wastewatch:${POSTGRES_PASSWORD:-test_postgres}@postgres:5432/wastewatch
      # Every outbound channel OFF. A test run must not be able to send a
      # Telegram message, place a SIP call, or sound a real speaker.
      WW_SMTP_ENABLED: "true"
      WW_SMTP_HOST: mailpit
      WW_SMTP_PORT: "1025"
      WW_SMTP_TLS: "false"
      WW_TELEGRAM_ENABLED: "false"
      WW_SIP_ENABLED: "false"
      WW_IP_SPEAKER_ENABLED: "false"
      WW_TTS_ENABLED: "false"
    depends_on:
      # api and pipeline first — the workers only consume what the
      # pipeline emits, so starting them earlier just logs connection
      # errors and muddies a test run.
      api:
        condition: service_healthy
      pipeline:
        condition: service_healthy
    volumes:
      - evidence_test:/tmp/wastewatch/evidence
    command: ["python3", "-m", "services.combined_workers.main"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1',9100))==0 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  pipeline:
    build:
      context: ./pipeline
    env_file:
      - .env
    environment:
      <<: *ww-env
      WW_EVIDENCE_DIR: /app/evidence
      WW_USE_SEG_MODEL: ${WW_USE_SEG_MODEL:-1}
      WW_SOURCES: ""
      GST_DEBUG: ${GST_DEBUG:-2}
    volumes:
      # Models are read-only here: a test run must not mutate the engines
      # the dev stack is using. entrypoint.py Phase 1 still validates and
      # will fail the run if an engine is missing or corrupt.
      - ./pipeline/models:/app/models:ro
      - ./pipeline/configs:/app/configs:ro
      - evidence_test:/app/evidence
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-m", "app.heartbeat"]
      interval: 20s
      timeout: 10s
      retries: 3
      # Models are read-only here so no engine build should happen, but a
      # cold DeepStream start is still slow.
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      # Vite inlines VITE_* at BUILD time, so these must be build args.
      # Setting them under `environment:` would have no effect on the
      # already-compiled bundle.
      args:
        # Browser-facing URLs: host-reachable, not container-network names.
        VITE_API_URL: http://localhost:9082
        VITE_WS_URL: ws://localhost:9082/ws
        VITE_MEDIAMTX_URL: http://localhost:9889
    ports:
      - "6174:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  evidence_test:
  tts_test:
