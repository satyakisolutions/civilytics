%YAML:1.0
####################################################################################################
# WasteWatch tracker — NvSORT (NVIDIA-optimised SORT) tuned for RF-DETR FP16 sigmoid scores.
#
# Section names + key names below MUST match the DeepStream 7.0 schema exactly.
# The previous version of this file used keys from a 3rd-party ByteTrack
# implementation (TrackingAlgo, tracking_algo, track_thresh, etc.) — every
# one of those was ignored at load time with
#   [WARNING][NvTrackerParamsBase] Unknown param found: ...
# which left the tracker running on built-in defaults that assume YOLO-era
# 0.5+ detector confidence. RF-DETR FP16 emits 0.05–0.20 on real targets,
# so the default minDetectorConfidence ≈ 0.13 was eating roughly half our
# detections and producing the on/off "flicker" the operator sees.
#
# Reference: /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvSORT.yml
####################################################################################################

BaseConfig:
  # If a detection's score is below this, it is NOT considered for tracking.
  # Calibrated for FP32 engine where real targets score 0.25+.
  minDetectorConfidence: 0.15
  # Moved from DataAssociator (confirmed via runtime warning: "DataAssociator:
  # checkClassMatch is ignored. Use BaseConfig:checkClassMatch instead." —
  # and via the real DS9.1 sample config_tracker_NvDeepSORT.yml, which has
  # it here, not under DataAssociator).
  checkClassMatch: 1

TargetManagement:
  enableBboxUnClipping: 1     # Keep the bbox visible when it touches the image border.
  maxTargetsPerStream: 200

  # Creation & termination policy
  minIouDiff4NewTarget: 0.6   # Raised from 0.5 — favors re-linking to an existing (possibly shadow-tracked) target over spawning
                              # a fresh ID when a reappearing detection overlaps a track's Kalman-predicted position.
  minTrackerConfidence: 0.10  # Below this, the track goes into shadow mode (Kalman-only).
  probationAge: 1             # 1 frame confirmation — objects appear immediately. False positives die after earlyTerminationAge anyway.
  maxShadowTrackingAge: 50    # Was 750 (~30s), then 375 (~15s) -- both cleared the mask later than the person's actual
                              # exit. Explicit requirement: clear as close to real exit time as possible, with only a
                              # short (~2s @ 25fps) grace period for brief real occlusion, not a loop-cycle-length one.
  # Was 1, then 5 -- both tuned assuming ~25fps ("a few frames' grace" ==
  # ~0.2-1s). Actual running cameras are 15fps (cam-02, confirmed via the
  # rtsp-streamer's ffmpeg args), so 5 frames was only ~0.33s of real
  # tolerance -- RF-DETR's low/noisy sigmoid scores (0.05-0.20) dip below
  # minDetectorConfidence that often, constantly killing and respawning a
  # NEW track_id for the SAME physical person: dwell time reset to 0, any
  # OBSERVE/VIOLATION highlight and waste attribution lost mid-incident
  # (operator sees the red/yellow box "jump" to a different id, or a
  # confirmed dumper's box vanish right as they walk away). Raised to
  # give ~1.3s of real grace at 15fps.
  earlyTerminationAge: 20

TrajectoryManagement:
  useUniqueID: 1              # 64-bit unique IDs across the run — needed for our FSM dwell counters.

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1   # CASCADED — better when many similar-class targets share the frame.

  # Thresholds for valid candidates (keep loose for sigmoid-low DETR scores).
  # NvDCF visual-similarity matching was tried here to stop a nearby
  # DIFFERENT person/vehicle stealing a track on IOU+size alone (confirmed
  # live: a suspicious person's VIOLATION track got reassigned to a
  # passing two-wheeler rider) -- reverted: the per-target correlation
  # filter's extra GPU work corrupted encoder output under this box's
  # load. Mitigated more cheaply instead: raised minMatchingScore4Overall
  # so a poor-overlap candidate is rejected (spawns a fresh, honest ID)
  # rather than silently accepted as the same target.
  minMatchingScore4Overall:        0.35
  minMatchingScore4SizeSimilarity: 0.40
  minMatchingScore4Iou:            0.20
  matchingScoreWeight4SizeSimilarity: 0.20
  matchingScoreWeight4Iou:            0.40

  # Tentative detections — anything between minDetectorConfidence (0.04)
  # and this threshold is treated as "weak" and only IOU-matched against
  # existing tracks (no new track spawns). This is the key anti-flicker
  # mechanism: when RF-DETR's score dips from 0.12 to 0.06 for one frame,
  # the detection still matches the existing track instead of being dropped.
  tentativeDetectorConfidence: 0.25
  minMatchingScore4TentativeIou: 0.25
  usePrediction4Assoc: 1

StateEstimator:
  stateEstimatorType: 2       # REGULAR (full Kalman with size/aspect terms — best for shadow mode).

  noiseWeightVar4Loc: 0.0301
  noiseWeightVar4Vel: 0.0017
  useAspectRatio: 1
