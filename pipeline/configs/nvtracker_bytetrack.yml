%YAML:1.0
# ByteTrack via nvtracker — tuned for RF-DETR FP16 sigmoid-head confidences.
# Keep these in lock-step with pre-cluster-threshold in nvinfer_rfdetr.txt:
# our RF-DETR FP16 engine emits ~0.15-0.22 on confident real detections and
# ~0.05-0.08 on background noise queries. Setting minDetectorConfidence
# higher than 0.22 silently eats every object downstream (nvtracker emits
# an empty obj_meta_list), which presents as "inference is broken".
BaseConfig:
  minDetectorConfidence: 0.12
  minTrackerConfidence:  0.10
  trackerMaxShadowTrailingAge: 30
  probationAge: 3
  maxTargetsPerStream: 150
  enableBatchProcess: 1

TargetManagement:
  enableTargetManagement: 1
  maxTargetsPerStream: 150
  minIouDiff4NewTarget: 0.7
  preserveStreamUpdateOrder: 0
  maxShadowTrackingAge: 30
  probationAge: 3
  earlyTerminationAge: 1

TrackingAlgo:
  tracking_algo: 1
  track_thresh:  0.15
  high_thresh:   0.22
  match_thresh:  0.8
  track_buffer:  30
