# RTSP test streamer — publishes sample videos into mediamtx.
# Usage: docker compose -f docker-compose.yml -f docker-compose.rtsp-streamer.yml up rtsp-streamer
services:
  rtsp-streamer:
    image: jrottenberg/ffmpeg:6-alpine
    container_name: lsg-rtsp-streamer
    depends_on:
      mediamtx:
        condition: service_started
    volumes:
      - ./sample_videos:/videos:ro
    entrypoint: ["/bin/sh", "/videos/stream.sh"]
    environment:
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_PORT: "8554"
      VIDEO_DIR: /videos
      LSG_LIVE_SRC_2: VID-20260131-WA0006.mp4
    restart: unless-stopped
